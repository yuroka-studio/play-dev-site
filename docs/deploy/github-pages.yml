# Deploys the site to GitHub Pages (free for public repositories).
#
# To use it: copy this file to .github/workflows/pages.yml, then in your
# repository open Settings > Pages and set Source to "GitHub Actions".
# Read "GitHub Pages" in the README first: it needs a custom domain (or a
# repository named <name>.github.io) and has no language redirect.
#
# It is kept out of .github/workflows on purpose, so the template never deploys
# the example site by accident. The build fails until site.config.ts is yours.
#
# Two jobs: `build` installs the dependencies and builds with read-only access
# to the repository; only `deploy`, which runs no project code, may publish.
# A script inside a dependency therefore cannot get the Pages deploy token.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job asks for what it needs; nothing is granted by default.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
